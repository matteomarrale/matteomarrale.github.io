<style>
/* Portfolio_OS — desktop: icone a sinistra, finestre trascinabili, barra in basso. */
/* Fallback per Jacquard 24 (pixel blackletter condensato): Georgia ridotta, così il layout non salta mentre il font arriva.
   In Astro: self-host dei woff2 e metriche tarate con fontaine/capsize. */
@font-face{font-family:'Jacquard Fallback'; src:local('Georgia'), local('Times New Roman'); size-adjust:90%; ascent-override:92%; descent-override:22%; line-gap-override:0%}
:root{
  color-scheme: dark;
  /* colori neutri (scelta di Matteo, 2026-10-21): bianco, nero e grigi */
  --white:#FFFFFF; --grey-light:#E6E6E6; --grey-mid:#999999; --grey-text:#595959; --grey-dark:#333333; --black:#000000;
  --f-black:'Jacquard 24','Jacquard Fallback',Georgia,serif;
  --f-ui:'EB Garamond',Garamond,Georgia,serif;
  --f-text:'EB Garamond',Garamond,Georgia,serif;
  --f-head:'IM Fell English',Georgia,serif;
  --bar-h:64px; --vh:100vh;
  --ease-out:cubic-bezier(.165,.84,.44,1); --ease-in-out:cubic-bezier(.645,.045,.355,1);
}
@supports (height:100dvh){ :root{--vh:100dvh} }
html,body{height:100%}
.no-js #landing,.no-js #app,.no-js #classic,.no-js #boot{display:none!important}
body{
  margin:0; overflow:hidden; color:var(--white); font-family:var(--f-text); font-size:18px; line-height:1.5;
  background:var(--grey-dark);
}
body.is-classic{overflow:auto; background:var(--black)}
a{color:inherit}
button{font:inherit; color:inherit; cursor:pointer}
/* Focus: anello doppio (nero + bianco) così si vede sia sul chiaro sia sullo scuro. */
:focus-visible{outline:3px solid var(--black); outline-offset:0; box-shadow:0 0 0 6px var(--white)}
.win-body:focus-visible{outline:none; box-shadow:inset 0 0 0 3px var(--black)}
.ld-card:focus-visible{box-shadow:0 0 0 6px var(--white)}
.win:focus-visible{outline:none; box-shadow:0 0 0 6px var(--white)}
.skip-link{position:absolute; left:16px; top:-60px; z-index:5000; padding:10px 14px; background:var(--white); color:var(--black); border:3px solid var(--black); border-radius:10px; font:600 16px var(--f-ui); text-decoration:none}
.skip-link:focus{top:16px}

/* ---------- desktop ---------- */
#app{position:fixed; inset:0; height:var(--vh)}
/* movimento off */
.motion-off *, .motion-off *::before, .motion-off *::after{animation:none !important; transition:none !important}

/* icone */
#icons{position:absolute; z-index:2; left:20px; top:24px; display:grid; grid-template-columns:repeat(2,112px); gap:18px 8px}
.icon{display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px 2px; background:none; border:0; border-radius:10px; font:400 14px/1.3 var(--f-ui); color:var(--white); text-align:center}
.icon .lbl{background:var(--black); padding:2px 5px; border-radius:4px}
.tip{margin:18px 0 0; padding:10px 12px; max-width:62ch; border:2px dashed var(--grey-text); font:400 15px/1.5 var(--f-ui); color:var(--grey-text)}

/* ---------- finestre ---------- */
#windows{position:absolute; inset:0 0 var(--bar-h) 0; z-index:10; pointer-events:none}
.win{
  position:absolute; pointer-events:auto; display:flex; flex-direction:column;
  width:min(720px,calc(100vw - 300px)); height:min(620px,calc(var(--vh) - var(--bar-h) - 60px));
  background:var(--white); color:var(--black); border:4px solid var(--black);
}
.win.wide{width:min(900px,calc(100vw - 300px))}
.win.small{width:min(520px,calc(100vw - 300px)); height:auto; max-height:calc(var(--vh) - var(--bar-h) - 60px)}
.win:focus{outline:none}
.win.is-top{box-shadow:0 0 0 3px var(--white)}
.win-bar{display:flex; align-items:center; gap:10px; padding:8px 12px 8px 14px; background:var(--grey-dark); color:var(--white); border-bottom:4px solid var(--black); cursor:grab; user-select:none; touch-action:none}
.win-bar:active{cursor:grabbing}
.win-bar h2{flex:1; margin:0; font:600 16px var(--f-ui); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.win-btns{display:flex; gap:8px}
.win-btns button{width:32px; height:32px; border:3px solid var(--black); border-radius:50%; padding:0; display:grid; place-items:center; transition:transform .12s ease}
.win-btns button:active{transform:scale(.92)}
.win-btns .min{background:var(--white)}
.win-btns .close{background:var(--black); color:var(--white)}
.win-body{flex:1; min-height:0; overflow:auto; padding:6px 30px 26px; font-size:17px; line-height:1.6; overscroll-behavior:contain}

/* ---------- contenuto delle finestre ---------- */
.win-body h1,.cl h1{font:400 clamp(56px,7vw,92px)/.92 var(--f-black); color:var(--black); margin:10px 0 6px; text-wrap:balance}
.win-body h2.t,.cl h2.t{font:400 clamp(32px,3.9vw,44px)/1.1 var(--f-head); color:var(--black); margin:14px 0 6px; text-wrap:balance}
.win-body h3,.cl h3{font:400 24px/1.2 var(--f-head); color:var(--black); margin:26px 0 6px}
.meta{font:700 20px/1.45 var(--f-text); color:var(--grey-text); margin:0 0 14px}
.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px 18px; margin:8px 0 14px; padding:12px 14px; border:3px solid var(--black); background:var(--grey-light)}
.facts div{display:flex; flex-direction:column; gap:1px; min-width:0}
.facts dt{font:400 14px/1.3 var(--f-ui); color:var(--grey-text)}
.facts dd{margin:0; font:700 17px/1.3 var(--f-text); color:var(--black); overflow-wrap:anywhere}
.lede{font-size:21px; line-height:1.45; margin:6px 0 10px; max-width:58ch}
.prose{max-width:62ch}
.prose p{margin:0 0 12px}
.prose ul{margin:0 0 12px; padding-left:1.2em}
.prose li{margin:0 0 8px}
.problem{margin:6px 0; padding:14px 18px; border:3px solid var(--black); background:var(--grey-light); font-size:20px; line-height:1.4; font-style:italic; max-width:58ch}
.loop{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:6px 0 12px; font:600 17px var(--f-ui)}
.loop span{padding:8px 12px; border:3px solid var(--black); background:var(--white)}
.loop span.end{background:var(--black); color:var(--white)}
.loop i{font-style:normal; color:var(--black)}
.ph{display:grid; place-items:center; text-align:center; padding:12px; border:3px dashed var(--black); border-radius:12px; background:repeating-linear-gradient(135deg,var(--grey-light) 0 10px,var(--white) 10px 20px); font:400 14px/1.4 var(--f-ui); color:var(--grey-text); max-width:100%; box-sizing:border-box}
.ph-169{aspect-ratio:16/9; width:min(100%,570px); max-height:320px}
.ph-portrait{width:140px; aspect-ratio:4/5; float:right; margin:0 0 10px 16px}
.portrait{width:150px; height:auto; aspect-ratio:1; object-fit:cover; float:right; margin:0 0 10px 16px; border:3px solid var(--black); border-radius:14px}
.gallery{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin:8px 0}
.gallery .ph-169{width:100%; max-height:none}
.todo{display:inline; padding:1px 6px; background:var(--white); color:var(--black); border-radius:4px; font:600 15px var(--f-ui)}
.script{margin:8px 0; padding:18px; border:3px solid var(--black); border-radius:14px; background:var(--white); font:400 17px/1.7 var(--f-ui); text-align:center}
.script .who{font-weight:600; letter-spacing:.1em}
.script .par{color:var(--grey-text)}
.btn{display:inline-flex; align-items:center; min-height:46px; padding:0 18px; border:3px solid var(--black); background:var(--white); color:var(--black); font:600 16px var(--f-ui); text-decoration:none; transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn.red{background:var(--black); color:var(--white)}
.btn[aria-disabled="true"]{border-style:dashed; color:var(--grey-text); cursor:not-allowed}
.btns{display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 6px}
.list{list-style:none; padding:0; margin:8px 0; display:grid; gap:8px}
.list li{display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; padding:12px 14px; border:3px solid var(--black); border-radius:12px; background:var(--grey-light)}
.list li b{font:700 22px/1.25 var(--f-text); color:var(--black)}
.list li.sealed{border-style:dashed}
.list li:has(.proj){padding:0}
.proj{width:100%; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; padding:12px 40px 12px 14px; position:relative; background:none; border:0; border-radius:10px; text-align:left; color:var(--black); font:400 17px/1.4 var(--f-text)}
.proj > span{min-width:0}
@media (hover:hover){ .proj:hover{background:var(--white)} }
.proj b{flex:1 1 100%}
.proj .arr{position:absolute; right:14px; top:50%; transform:translateY(-50%); font:600 25px var(--f-ui); color:var(--black)}
.email{font:600 clamp(16px,2.4vw,22px) var(--f-ui); color:var(--black); text-decoration:underline; text-underline-offset:4px; word-break:break-all; padding:10px 12px; border:3px solid var(--black); border-radius:12px; background:var(--white); display:inline-block}
.tools{font:400 16px/1.8 var(--f-ui)}

/* ---------- barra ---------- */
#taskbar{position:absolute; left:0; right:0; bottom:0; z-index:1000; height:var(--bar-h); box-sizing:border-box; padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px)); display:flex; align-items:center; gap:10px; background:var(--black); border-top:4px solid var(--grey-mid); font:400 15px var(--f-ui)}
#startBtn{display:flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; background:var(--grey-dark); color:var(--white); border:3px solid var(--white); border-radius:22px; font:600 16px var(--f-ui); flex:0 0 auto}
#tabs{flex:1; min-width:0; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none}
#tabs button{flex:0 0 auto; min-height:40px; padding:0 12px; background:var(--grey-dark); color:var(--white); border:2px solid transparent; border-radius:10px; font:400 14px var(--f-ui)}
#tabs button.active{border-color:var(--white)}
#tabs button.min{opacity:.7; font-style:italic}
.settings{display:flex; gap:6px; flex:0 0 auto}
.settings button{min-height:40px; padding:0 10px; background:transparent; color:var(--white); border:2px solid var(--grey-mid); border-radius:10px; font:400 14px var(--f-ui)}
.settings button.classic{background:var(--white); color:var(--black); border-color:var(--white); font-weight:600}

#startmenu{position:absolute; z-index:1100; left:12px; bottom:calc(var(--bar-h) + 10px); width:min(320px,calc(100vw - 24px)); max-height:calc(var(--vh) - var(--bar-h) - 30px); overflow:auto; background:var(--white); color:var(--black); border:4px solid var(--black); }
#startmenu .sm-head{padding:12px 16px; background:var(--grey-dark); color:var(--white); border-bottom:4px solid var(--black); font:400 34px/1 var(--f-black)}
#startmenu ul{list-style:none; margin:0; padding:8px}
#startmenu li button{width:100%; display:flex; justify-content:space-between; align-items:center; min-height:42px; padding:0 10px; background:none; border:0; border-radius:8px; font:400 15px var(--f-ui); text-align:left; color:var(--black)}
#startmenu li button:hover,#startmenu li button:focus-visible{background:var(--grey-light)}
#startmenu .sep{height:3px; margin:6px 8px; background:var(--black)}

#toast{position:absolute; z-index:1500; left:50%; bottom:calc(var(--bar-h) + 40px); transform:translateX(-50%); padding:10px 16px; background:var(--white); color:var(--black); border:3px solid var(--black); border-radius:12px; font:600 15px var(--f-ui)}

/* ---------- avvio ---------- */
#boot{position:fixed; inset:0; z-index:2000; height:var(--vh); overflow:hidden; background:var(--black)}
#boot .txt{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(640px,calc(100vw - 32px)); max-height:calc(100% - 32px); overflow:auto; box-sizing:border-box; padding:24px 26px; background:var(--black); border:3px solid var(--white); font:400 16px/1.9 var(--f-ui); color:var(--white); z-index:3}
#boot .logo{font:400 clamp(48px,9vw,84px)/1 var(--f-black); color:var(--grey-mid); margin:0 0 12px}
#boot .ln{margin:0; white-space:pre-wrap; opacity:0}
#boot .ln.on{opacity:1}
#boot .press{margin:16px 0 0; color:var(--white)}
#skip{position:absolute; z-index:4; right:20px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); min-height:44px; padding:0 16px; background:var(--black); color:var(--white); border:2px solid var(--grey-mid); border-radius:10px; font:400 15px var(--f-ui)}
@media (max-height:520px){ #boot .txt{padding:14px 16px; font-size:12px; line-height:1.6} #boot .logo{font-size:36px; margin-bottom:6px} }

/* ---------- home: scegli come vedere ---------- */
#landing{position:fixed; inset:0; z-index:2500; height:var(--vh); overflow:auto; display:flex; flex-direction:column; color:var(--white); background:var(--grey-dark)}
.ld-top{position:relative; display:flex; justify-content:flex-end; padding:16px 16px 0}

.ld-main{position:relative; flex:1; display:flex; flex-direction:column; justify-content:center; gap:22px; width:min(980px,100%); box-sizing:border-box; margin:0 auto; padding:24px 16px 48px}
.ld-name{margin:0; font:400 clamp(60px,11vw,128px)/.88 var(--f-black); color:var(--white)}

.ld-choices{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:18px}
.ld-card{display:flex; flex-direction:column; gap:10px; padding:0; text-align:left; border:4px solid var(--black); overflow:hidden; transition:transform .12s ease}
@media (hover:hover) and (pointer:fine){ .ld-card:hover{transform:translate(-2px,-3px)} }
.ld-card .bar{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:4px solid var(--black); font:600 16px var(--f-ui)}
.ld-card .in{display:flex; flex-direction:column; gap:8px; padding:6px 20px 22px}
.ld-card b{font:700 clamp(26px,3vw,32px)/1.15 var(--f-text)}
.ld-card p{margin:0; font-size:17px; line-height:1.5}
.ld-card .go{margin-top:6px; font:600 16px var(--f-ui)}
.ld-web{background:var(--white); color:var(--black)}
.ld-web .bar{background:var(--grey-light)}
.ld-web b{color:var(--black)}
.ld-os{background:var(--white); color:var(--black)}
.ld-os .bar{background:var(--grey-dark); color:var(--white)}
.ld-os b{color:var(--black)}

/* ---------- vista classica ---------- */
#classic{min-height:100%; background:var(--black); color:var(--white)}
.cl-top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; gap:10px 18px; padding:10px 16px; background:var(--black); border-bottom:4px solid var(--grey-mid)}
.cl-top b{flex:0 0 auto; font:400 30px/1 var(--f-black); color:var(--grey-mid)}
.cl-panel{flex:1; min-width:0; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px 14px}
.cl-menu{display:none; margin-left:auto; min-height:44px; padding:0 14px; background:transparent; color:var(--white); border:2px solid var(--grey-mid); border-radius:10px; font:600 15px var(--f-ui)}
.cl-top nav{display:flex; flex-wrap:wrap; gap:6px 14px; font:400 15px var(--f-ui)}
.cl-top nav a{text-decoration:none; min-height:40px; display:inline-flex; align-items:center}
.cl-top .act{display:flex; gap:6px}
.cl-top .act button{min-height:40px; padding:0 12px; border-radius:10px; font:600 14px var(--f-ui)}
#clLang,#clHome{background:transparent; color:var(--white); border:2px solid var(--grey-mid)}
#clBack{background:var(--grey-dark); color:var(--white); border:2px solid var(--grey-dark)}
.cl{max-width:820px; margin:0 auto; padding:24px 16px 80px; display:grid; gap:28px}
/* ancore: la barra fissa non copre il titolo della scheda */
.cl section,.cl article,.cl [id]{scroll-margin-top:calc(var(--cl-top-h,64px) + 16px)}
.cl h1:focus,.cl h2:focus{outline:none}
.cl h1:focus-visible,.cl h2:focus-visible{outline:3px solid var(--black); box-shadow:0 0 0 6px var(--white)}
.cl section,.cl article{background:var(--white); color:var(--black); border:4px solid var(--black); padding:20px clamp(16px,4vw,32px) 24px}

/* ---------- schermi piccoli ---------- */
@media (max-width:760px){
  :root{--bar-h:58px}
  #icons{left:16px; right:16px; top:16px; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px 6px}

  .win,.win.wide,.win.small{left:8px !important; top:8px !important; width:auto !important; right:8px; height:auto !important; bottom:14px; max-height:none}
  .win-bar{cursor:default}
  .win-body{padding:4px 18px 20px; font-size:16px}
  /* sul telefono resta la lingua; il resto è nel menu START */
  #sMotion,#sClassic{display:none}
  .settings button{padding:0 8px; font-size:11px}
  #tabs button{max-width:150px; overflow:hidden; text-overflow:ellipsis}
  .ph-portrait{width:110px}
  .portrait{width:112px}
  /* versione web sul telefono: una riga sola (nome + Menu), circa 64 px */
  .cl-top{padding:8px 16px}
  .cl-top b{font-size:26px}
  .cl-menu{display:inline-flex; align-items:center}
  .cl-panel{display:none; position:absolute; left:0; right:0; top:100%; flex-direction:column; align-items:stretch; gap:12px; padding:8px 16px 16px; background:var(--black); border-bottom:4px solid var(--grey-mid); max-height:calc(var(--vh) - 80px); overflow:auto}
  .cl-top.open .cl-panel{display:flex}
  .cl-top nav{flex-direction:column; gap:0}
  .cl-top nav a{min-height:44px; font-size:15px}
  .cl-top .act{flex-wrap:wrap}
}
</style>

    : "A 2D run'n'gun roguelite set in a cat-shaped Hell, developed in Unity.",

  });
 }},
 otherside:{file:"Other Side", size:"", body:function(){
  var it = S.lang==="it", L = LBL[S.lang];
  return projectSheet({ l:L, title:"Other Side",
   facts:[[L.role, it?"Progetto personale":"Solo personal project"],[it?"Stato":"Status", it?"Prototipo giocabile":"Playable prototype"],[L.engine,"Unity (URP)"],[L.platform,"Windows"],[it?"Genere":"Genre", it?"Dungeon crawler a turni in prima persona, permadeath":"First-person turn-based dungeon crawler, permadeath"]],
   media: it?"[IMG 16:9 · gameplay di Other Side · 19 ott]":"[IMG 16:9 · Other Side gameplay · 19 Oct]",
   context: it ? "Un dungeon crawler a turni in prima persona con permadeath, sviluppato in Unity. Ogni nemico si sconfigge sfruttando gli oggetti e la stanza. Quando muori ricominci da capo: tra una run e l'altra conservi solo un diario che disegni e scrivi tu."
    : "A first-person, turn-based dungeon crawler with permadeath, developed in Unity. You beat each enemy by using your items and the room around you. When you die, you start over: all you keep between runs is a journal you draw and write in yourself.",
   did: it ? ["Game design e sviluppo: Matteo Marrale (programmazione con Claude Code)"]
    : ["Game design and development: Matteo Marrale (programming with Claude Code)"]
  });
 }},
 contact:{file:function(){ return S.lang==="it" ? "Contatti" : "Contact"; }, size:"small", body:function(){
  var it = S.lang==="it";
  return '<h2 class="t">' + (it?'Contatti':'Contact') + '</h2><div class="prose"><p>' + (it?'Puoi scrivermi a:':'You can write to me at:') + '</p></div>' +
   '<p><a class="email" id="emailText" href="mailto:' + EMAIL + '">' + EMAIL + '</a></p>' +
   '<div class="btns"><button class="btn red" data-copy="1">' + (it?'Copia email':'Copy email') + '</button><a class="btn" href="' + LINKEDIN + '" target="_blank" rel="me noopener">LinkedIn ↗</a></div>' +
   '<div class="btns"><a class="btn" href="' + GITHUB + '" target="_blank" rel="me noopener">GitHub ↗</a><a class="btn" href="' + ITCH + '" target="_blank" rel="me noopener">Itch.io ↗</a></div>' +
   (DEV ? '<div class="btns"><span class="btn" aria-disabled="true">CV IT ' + todo("PDF") + '</span><span class="btn" aria-disabled="true">CV EN ' + todo("PDF") + '</span></div>' : '');
 }}
};
function fname(id){ var f = W[id].file; return typeof f === "function" ? f() : f; }
/* link diretti: queste schede si aprono nella versione web (#antiques, #catnhell, …); l'OS parte solo con #os */
var CARDS = ["antiques","casino","cosmic","train","nigishida","catnhell","otherside"];
var SECTION = {top:"c-top", about:"c-about", projects:"c-projects", personal:"c-personal", contact:"c-contact"};
function webTarget(h){ if (!h) return null; if (CARDS.indexOf(h) >= 0) return h; if (SECTION[h]) return SECTION[h]; if (/^c-[a-z-]+$/.test(h)) return h; return null; }
var ICON_ORDER = ["about","antiques","casino","cosmic","train","nigishida","personal","contact"];

/* ---------- elementi ---------- */
var app = document.getElementById("app");
var winLayer = document.getElementById("windows");
var tabs = document.getElementById("tabs");
var startBtn = document.getElementById("startBtn");
var startMenu = document.getElementById("startmenu");
var startList = document.getElementById("startList");
var toast = document.getElementById("toast");
var classic = document.getElementById("classic");
var boot = document.getElementById("boot");
var skipBtn = document.getElementById("skip");

/* ---------- toast ---------- */
var toastTimer = null;
function say(msg){ toast.textContent = msg; toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toast.hidden = true; }, 2200); }

/* ---------- finestre ---------- */
var open = {}; var zTop = 20; var cascade = 0; var lastOpener = {};
function isSmall(){ return window.innerWidth <= 760; }
function setHash(id){ try { history.replaceState(null, "", id ? "#" + id : location.pathname + location.search); } catch(e){} }

function buildWin(id){
 var def = W[id];
 var el = document.createElement("section");
 el.className = "win" + (def.size ? " " + def.size : "");
 el.setAttribute("role","dialog");
 el.setAttribute("aria-labelledby","wt-"+id);
 el.tabIndex = -1;
 el.dataset.id = id;
 el.innerHTML =
  '<div class="win-bar"><h2 id="wt-' + id + '">' + fname(id) + '</h2><div class="win-btns"><button class="min" aria-label="' + t("min") + '">' + MIN_BAR + '</button><button class="close" aria-label="' + t("close") + '">' + CLOSE_X + '</button></div></div>' +
  '<div class="win-body" tabindex="0"></div>';
 el.querySelector(".win-body").innerHTML = def.body();
 return el;
}
function place(el, id){
 if (isSmall()) return;
 var w = el.offsetWidth, h = el.offsetHeight;
 var areaW = window.innerWidth, areaH = window.innerHeight - parseInt(getComputedStyle(document.documentElement).getPropertyValue("--bar-h")||64,10);
 var x, y;
 if (id === "welcome") { x = Math.max(260, (areaW - w)/2 + 60); y = Math.max(24, (areaH - h)/2 - 20); }
 else { x = Math.min(areaW - w - 20, 270 + (cascade % 6) * 36); y = Math.min(Math.max(20, areaH - h - 30), 30 + (cascade % 6) * 30); cascade++; }
 el.style.left = Math.max(8, x) + "px"; el.style.top = Math.max(8, y) + "px";
}
function focusBody(id){ var el = open[id]; if (!el) return; var b = el.querySelector(".win-body"); (b || el).focus({preventScroll:true}); }
function focusWin(id){
 var el = open[id]; if (!el) return;
 el.hidden = false; el.dataset.min = "";
 zTop++; el.style.zIndex = zTop;
 Object.keys(open).forEach(function(k){ open[k].classList.toggle("is-top", k===id); });
 renderTabs();
 setHash("os");
}
function openWin(id, opener){
 if (!W[id]) return;
 closeStart();
 if (opener) lastOpener[id] = opener;
 if (open[id]) { focusWin(id); focusBody(id); return; }
 var el = buildWin(id);
 winLayer.appendChild(el);
 open[id] = el;
 place(el, id);
 focusWin(id);
 focusBody(id);
}
function closeWin(id){
 var el = open[id]; if (!el) return;
 delete open[id];
 var done = function(){ el.remove(); renderTabs(); var back = lastOpener[id]; if (back && document.body.contains(back)) back.focus(); else { var top = topWinId(); if (top) focusBody(top); } };
 done();
 renderTabs();
 setHash("os");
}
function minWin(id){ var el = open[id]; if (!el) return; el.hidden = true; el.dataset.min = "1"; el.classList.remove("is-top"); renderTabs(); }
function topWinId(){ var best = null, bz = -1; Object.keys(open).forEach(function(k){ var el = open[k]; if (el.hidden) return; var z = +el.style.zIndex||0; if (z > bz) { bz = z; best = k; } }); return best; }

function renderTabs(){
 var top = topWinId();
 tabs.innerHTML = "";
 var first = true;
 Object.keys(open).forEach(function(k){
  var b = document.createElement("button");
  b.textContent = fname(k);
  b.tabIndex = (k===top || (!top && first)) ? 0 : -1; first = false;
  if (k===top) { b.classList.add("active"); b.setAttribute("aria-current","true"); }
  if (open[k].hidden) b.classList.add("min");
  b.addEventListener("click", function(){ if (open[k].hidden || k!==topWinId()) { focusWin(k); focusBody(k); } else { minWin(k); } });
  tabs.appendChild(b);
 });
}
/* barra delle finestre: frecce per spostarsi tra le schede (role=toolbar) */
tabs.addEventListener("keydown", function(e){
 if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
 var bs = Array.prototype.slice.call(tabs.querySelectorAll("button")); if (!bs.length) return;
 var i = bs.indexOf(document.activeElement); if (i < 0) i = 0;
 var n = (i + (e.key === "ArrowRight" ? 1 : -1) + bs.length) % bs.length;
 bs.forEach(function(b){ b.tabIndex = -1; }); bs[n].tabIndex = 0; bs[n].focus(); e.preventDefault();
});

/* eventi delle finestre (delegati) */
winLayer.addEventListener("click", function(e){
 var win = e.target.closest(".win"); if (!win) return;
 var id = win.dataset.id;
 if (e.target.closest(".close")) { closeWin(id); return; }
 if (e.target.closest(".min")) { minWin(id); return; }
 var o = e.target.closest("[data-open]"); if (o) { openWin(o.dataset.open, o); return; }
 if (e.target.closest("[data-copy]")) { copyEmail(); return; }
});
winLayer.addEventListener("pointerdown", function(e){
 var win = e.target.closest(".win"); if (!win) return;
 if (win.dataset.id !== topWinId()) focusWin(win.dataset.id);
 var bar = e.target.closest(".win-bar");
 if (!bar || e.target.closest("button") || isSmall()) return;
 e.preventDefault();
 var sx = e.clientX, sy = e.clientY, ox = win.offsetLeft, oy = win.offsetTop;
 bar.setPointerCapture(e.pointerId);
 function mv(ev){
  var nx = ox + ev.clientX - sx, ny = oy + ev.clientY - sy;
  nx = Math.min(Math.max(nx, -win.offsetWidth + 120), window.innerWidth - 120);
  ny = Math.min(Math.max(ny, 0), window.innerHeight - 120);
  win.style.left = nx + "px"; win.style.top = ny + "px";
 }
 function up(){ bar.removeEventListener("pointermove", mv); bar.removeEventListener("pointerup", up); bar.removeEventListener("pointercancel", up); }
 bar.addEventListener("pointermove", mv); bar.addEventListener("pointerup", up); bar.addEventListener("pointercancel", up);
});

function copyEmail(){
 var done = function(){ say(t("copied")); };
 var fail = function(){ var n = document.getElementById("emailText"); if (n) { var r = document.createRange(); r.selectNodeContents(n); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } say(t("copyFail")); };
 try { navigator.clipboard.writeText(EMAIL).then(done, fail); } catch(e){ fail(); }
}

/* ---------- icone della scrivania ---------- */
var iconsNav = document.getElementById("icons");
function renderIcons(){
 iconsNav.innerHTML = "";
 ICON_ORDER.forEach(function(id){
  var b = document.createElement("button");
  b.className = "icon"; b.dataset.open = id;
  b.innerHTML = '<span class="lbl">' + fname(id) + '</span>';
  b.addEventListener("click", function(){ openWin(id, b); });
  iconsNav.appendChild(b);
 });
}

/* ---------- menu START ---------- */
function renderStart(){
 var h = "";
 ["welcome","projects"].concat(ICON_ORDER).forEach(function(id){ h += '<li><button data-open="' + id + '"><span>' + fname(id) + '</span><span aria-hidden="true">›</span></button></li>'; });
 h += '<li class="sep" aria-hidden="true"></li>';
 h += '<li><button data-set="motion" aria-pressed="' + S.motion + '"><span>' + t("motion")[S.motion?1:0] + '</span></button></li>';
 h += '<li><button data-set="lang"><span>' + t("lang") + '</span></button></li>';
 h += '<li><button data-set="classic"><span>' + t("classic") + '</span><span aria-hidden="true">›</span></button></li>';
 h += '<li class="sep" aria-hidden="true"></li>';
 h += '<li><button data-set="reboot"><span>' + t("reboot") + '</span><span aria-hidden="true">↻</span></button></li>';
 h += '<li><button data-set="home"><span>' + t("home") + '</span><span aria-hidden="true">⌂</span></button></li>';
 startList.innerHTML = h;
}
function closeStart(){ startMenu.hidden = true; startBtn.setAttribute("aria-expanded","false"); }
startBtn.addEventListener("click", function(){
 var willOpen = startMenu.hidden;
 if (willOpen) { renderStart(); startMenu.hidden = false; startBtn.setAttribute("aria-expanded","true"); var f = startList.querySelector("button"); if (f) f.focus(); }
 else closeStart();
});
startList.addEventListener("click", function(e){
 var o = e.target.closest("[data-open]"); if (o) { openWin(o.dataset.open, startBtn); return; }
 var s = e.target.closest("[data-set]"); if (s) { toggle(s.dataset.set); renderStart(); }
});
startMenu.addEventListener("keydown", function(e){
 if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
 var bs = Array.prototype.slice.call(startList.querySelectorAll("button"));
 var i = bs.indexOf(document.activeElement); var n = (i + (e.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length;
 bs[n].focus(); e.preventDefault();
});
document.addEventListener("pointerdown", function(e){ if (!startMenu.hidden && !e.target.closest("#startmenu") && !e.target.closest("#startBtn")) closeStart(); });

/* ---------- impostazioni ---------- */
var sMotion = document.getElementById("sMotion"), sLang = document.getElementById("sLang"), sClassic = document.getElementById("sClassic");
function toggle(k){
 if (k==="motion") S.motion = !S.motion;
 if (k==="lang") { S.lang = S.lang==="en" ? "it" : "en"; relang(); }
 if (k==="classic") { setClassic(true); return; }
 if (k==="reboot") { closeStart(); save(); runBoot(); return; }
 if (k==="home") { showLanding(); return; }
 apply(); save();
}
sMotion.addEventListener("click", function(){ toggle("motion"); });
sLang.addEventListener("click", function(){ toggle("lang"); });
sClassic.addEventListener("click", function(){ toggle("classic"); });

function apply(){
 app.classList.toggle("motion-off", !S.motion); app.classList.toggle("motion-on", S.motion);
 document.body.classList.toggle("motion-off", !S.motion);
 sMotion.textContent = t("motion")[S.motion?1:0]; sMotion.setAttribute("aria-pressed", String(S.motion));
 sLang.textContent = t("lang");
 sClassic.textContent = t("classic");
 document.documentElement.lang = S.lang;
 iconsNav.setAttribute("aria-label", t("desktop"));
 tabs.setAttribute("aria-label", t("openWins"));
 document.querySelector(".settings").setAttribute("aria-label", t("settings"));
 var le = document.getElementById("ldEn"), li = document.getElementById("ldIt");
 if (le) { le.setAttribute("aria-pressed", String(S.lang==="en")); li.setAttribute("aria-pressed", String(S.lang==="it")); }
 document.querySelectorAll("[data-i18n]").forEach(function(n){ n.textContent = t(n.dataset.i18n); });
 skipBtn.textContent = S.motion ? t("skip") : t("cont");
}
function relang(){
 Object.keys(open).forEach(function(k){
  var b = open[k].querySelector(".win-body"); var top = b.scrollTop; b.innerHTML = W[k].body(); b.scrollTop = top;
  open[k].querySelector(".min").setAttribute("aria-label", t("min")); open[k].querySelector(".close").setAttribute("aria-label", t("close"));
  open[k].querySelector(".win-bar h2").textContent = fname(k);
 });
 renderIcons(); renderTabs();
 if (S.classic) { var y = window.scrollY; renderClassic(); window.scrollTo(0, y); }
}

/* ---------- vista classica ---------- */
function renderClassic(){
 var it = S.lang==="it";
 var nav = [["about", it?"Chi sono":"About me"],["projects", it?"Progetti":"Projects"],["personal", it?"Personali":"Personal"],["contact", it?"Contatti":"Contact"]];
 var h = '<a class="skip-link" href="#c-projects">' + t("skipTo") + '</a>';
 h += '<div class="cl-top"><b>Matteo Marrale</b><button class="cl-menu" id="clMenu" aria-expanded="false" aria-controls="clPanel">' + t("menu") + '</button><div class="cl-panel" id="clPanel"><nav aria-label="' + t("sections") + '">' + nav.map(function(n){ return '<a href="#c-' + n[0] + '">' + n[1] + '</a>'; }).join("") + '</nav><div class="act"><button id="clHome">Home</button><button id="clLang">' + t("lang") + '</button><button id="clBack">' + t("toOs") + '</button></div></div></div>';
 h += '<div class="cl">';
 h += '<section id="c-top">' + W.welcome.body("web") + '</section>';
 h += '<section id="c-about">' + W.about.body() + '</section>';
 h += '<div id="c-projects" style="display:grid;gap:28px">';
 ["antiques","casino","cosmic","train","nigishida"].forEach(function(id){ h += '<article id="' + id + '">' + W[id].body() + '</article>'; });
 h += '</div>';
 h += '<section id="c-personal">' + W.personal.body() + '</section>';
 h += '<div id="c-personal-sheets" style="display:grid;gap:28px">';
 ["catnhell","otherside"].forEach(function(id){ h += '<article id="' + id + '">' + W[id].body() + '</article>'; });
 h += '</div>';
 h += '<section id="c-contact">' + W.contact.body() + '</section>';
 h += '</div>';
 classic.innerHTML = h;
 /* ogni pulsante della pagina scorre alla scheda giusta (Cat 'n' Hell! e Other Side inclusi) */
 classic.querySelectorAll("[data-open]").forEach(function(b){ b.addEventListener("click", function(){ var tid = webTarget(b.dataset.open); if (tid) goWeb(tid, false); }); });
 var menuBtn = document.getElementById("clMenu"), bar = classic.querySelector(".cl-top");
 menuBtn.addEventListener("click", function(){ setMenu(!bar.classList.contains("open")); });
 classic.querySelectorAll(".cl-top nav a").forEach(function(a){ a.addEventListener("click", function(){ setMenu(false); }); });
 measureTop();
 classic.querySelectorAll("[data-copy]").forEach(function(b){ b.addEventListener("click", copyEmail); });
 document.getElementById("clLang").addEventListener("click", function(){ S.lang = S.lang==="en"?"it":"en"; apply(); relang(); save(); var b2 = document.getElementById("clLang"); if (b2) b2.focus({preventScroll:true}); });
 document.getElementById("clBack").addEventListener("click", function(){ setClassic(false); });
 document.getElementById("clHome").addEventListener("click", showLanding);
}
function setMenu(open){ var bar = classic.querySelector(".cl-top"), b = document.getElementById("clMenu"); if (!bar || !b) return; bar.classList.toggle("open", open); b.setAttribute("aria-expanded", String(open)); }
/* altezza reale della barra: serve a scroll-margin-top delle ancore */
function measureTop(){ var bar = classic.querySelector(".cl-top"); if (bar) document.documentElement.style.setProperty("--cl-top-h", bar.offsetHeight + "px"); }
function goWeb(tid, instant){
 var n = document.getElementById(tid); if (!n) return;
 measureTop();
 n.scrollIntoView({behavior: (S.motion && !instant) ? "smooth" : "auto", block:"start"});
 var hd = n.matches("h1,h2") ? n : n.querySelector("h1, h2"); if (hd) { hd.tabIndex = -1; hd.focus({preventScroll:true}); }
 if (CARDS.indexOf(tid) >= 0) setHash(tid);
}
function stopBoot(){ if (boot.hidden) return; bootTimers.forEach(clearTimeout); bootTimers = []; bootDone = true; boot.hidden = true; }
function setClassic(on, keepPlace){
 S.classic = on;
 closeStart();
 if (on) stopBoot();
 app.hidden = on; classic.hidden = !on;
 document.body.classList.toggle("is-classic", on);
 /* entrando nella versione web il focus va sull'h1 (il nome), non sul pulsante "Portfolio_OS" */
 if (on) { renderClassic(); if (!keepPlace) { window.scrollTo(0,0); setHash("web"); var f = classic.querySelector("#c-top h1"); if (f) f.focus({preventScroll:true}); } }
 else { classic.innerHTML = ""; if (!osBooted) runBoot(); else { setHash("os"); sClassic.focus(); } }
}

/* ---------- home ---------- */
var landing = document.getElementById("landing");
var osBooted = false;
function showLanding(){
 closeStart();
 if (S.classic) { S.classic = false; classic.hidden = true; classic.innerHTML = ""; document.body.classList.remove("is-classic"); }
 app.hidden = true;
 landing.hidden = false;
 setHash("");
 var b = document.getElementById(S.lang === "it" ? "ldIt" : "ldEn"); if (b) b.focus();
}
function enterWeb(){ landing.hidden = true; setClassic(true); }
function enterOS(){
 landing.hidden = true; app.hidden = false;
 if (!osBooted) runBoot(); else { setHash("os"); var id = topWinId(); if (id) focusBody(id); }
}
document.getElementById("goWeb").addEventListener("click", enterWeb);
document.getElementById("goOs").addEventListener("click", enterOS);
document.getElementById("ldEn").addEventListener("click", function(){ if (S.lang !== "en") { S.lang = "en"; apply(); relang(); save(); } });
document.getElementById("ldIt").addEventListener("click", function(){ if (S.lang !== "it") { S.lang = "it"; apply(); relang(); save(); } });

/* ---------- tastiera ---------- */
var MOD_KEYS = {Tab:1, Shift:1, Control:1, Alt:1, Meta:1, CapsLock:1, Escape:0};
document.addEventListener("keydown", function(e){
 if (!landing.hidden) return;
 if (!boot.hidden) { if (MOD_KEYS[e.key]) return; finishBoot(); e.preventDefault(); return; }
 if (e.key === "Escape") {
  if (!startMenu.hidden) { closeStart(); startBtn.focus(); return; }
  if (S.classic) { var mb = document.getElementById("clMenu"); if (mb && mb.getAttribute("aria-expanded") === "true") { setMenu(false); mb.focus(); } return; }
  var id = topWinId(); if (id) closeWin(id);
 }
});

/* ---------- avvio ---------- */
var bootLines = document.getElementById("bootLines");
var bootDone = false, bootTimers = [];
function renderBootLines(){
 bootLines.innerHTML = T[S.lang].boot.map(function(l){ return '<p class="ln"><span>' + l[0] + '</span><span class="' + l[2] + '">' + l[1] + '</span></p>'; }).join("");
}
function finishBoot(){
 if (bootDone) return; bootDone = true;
 bootTimers.forEach(clearTimeout); bootTimers = [];
 bootLines.querySelectorAll(".ln").forEach(function(n){ n.classList.add("on"); });
 boot.hidden = true; startDesktop();
}
function runBoot(){
 bootDone = false;
 boot.hidden = false;
 renderBootLines();
 setHash("os");
 skipBtn.textContent = S.motion ? t("skip") : t("cont");
 skipBtn.focus({preventScroll:true});
 var lines = bootLines.querySelectorAll(".ln");
 if (!S.motion) { /* senza movimento: tutte le righe subito, si aspetta un tasto o un clic */ lines.forEach(function(n){ n.classList.add("on"); }); return; }
 /* ritmo scelto da Matteo: una riga al secondo, poi 3 s per leggere (saltabile) */
 lines.forEach(function(n, i){ bootTimers.push(setTimeout(function(){ n.classList.add("on"); }, 1000 + i*1000)); });
 bootTimers.push(setTimeout(finishBoot, lines.length*1000 + 3000));
}
var initialHash = (location.hash || "").replace("#",""); /* letto prima che l'avvio riscriva l'hash */
function startDesktop(){
 var first = !osBooted;
 osBooted = true;
 openWin("welcome");
 if (first && initialHash && W[initialHash] && initialHash !== "welcome") openWin(initialHash);
}
boot.addEventListener("click", function(){ finishBoot(); });

/* ---------- init ---------- */
renderIcons();
apply();
/* instradamento: #os = Portfolio_OS; #web = versione web; #antiques, #catnhell, … = versione web sulla scheda; niente hash = home */
function route(initial){
 var hash = (location.hash || "").replace("#","");
 if (hash === "os") {
  if (S.classic) setClassic(false);
  else if (!landing.hidden || app.hidden) enterOS();
  return;
 }
 if (hash === "classic" || hash === "web") { if (!S.classic) enterWeb(); return; }
 var tid = webTarget(hash);
 if (tid) {
  if (!S.classic) { landing.hidden = true; setClassic(true, true); }
  if (!document.getElementById(tid)) { if (initial) { window.scrollTo(0,0); setHash("web"); } return; }
  requestAnimationFrame(function(){ goWeb(tid, initial); });
  /* i font cambiano le altezze: al primo caricamento si riallinea quando sono pronti */
  if (initial && document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if ((location.hash || "").replace("#","") === tid) goWeb(tid, true); });
  return;
 }
 if (!hash) { if (initial || S.classic || !app.hidden) showLanding(); return; }
 if (initial) showLanding();
}
route(true);
window.addEventListener("hashchange", function(){ route(false); });
window.addEventListener("resize", function(){ if (S.classic) { measureTop(); if (!isSmall()) setMenu(false); } });
window.addEventListener("resize", function(){ if (isSmall()) return; Object.keys(open).forEach(function(k){ var el = open[k]; var maxX = window.innerWidth - 120, maxY = window.innerHeight - 160; if (el.offsetLeft > maxX) el.style.left = maxX + "px"; if (el.offsetTop > maxY) el.style.top = Math.max(8,maxY) + "px"; }); });
})();
</script>
