<!doctype html><html lang="en" class="no-js"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Carne Viva OS — un desktop fatto di carne. Icone a sinistra, finestre trascinabili, barra in basso. Mondo unico e scuro per scelta. */
/* Fallback per Jacquard 24 (pixel blackletter condensato): Georgia ridotta, così il layout non salta mentre il font arriva.
   In Astro: self-host dei woff2 e metriche tarate con fontaine/capsize. */
@font-face{font-family:'Jacquard Fallback'; src:local('Georgia'), local('Times New Roman'); size-adjust:90%; ascent-override:92%; descent-override:22%; line-gap-override:0%}
:root{
  color-scheme: dark;
  --muscle-1:#5C0E1B; --muscle-2:#6D1523; --muscle-3:#4A0A15; --muscle-4:#61101E; --membrane:#3A0812;
  --flesh:#E0806E; --flesh-raw:#C9465A; --flesh-deep:#8E2434; --fat:#F2D06B; --bile:#9DB82B; --vein:#3E5BA9; --vein-light:#6F8BD6;
  --bone:#F1E6D6; --bone-2:#E4D5C1; --ink:#1A0A0E; --ink-soft:#4A3238; --blood:#B0081A; --blood-dry:#6E0410; --throat:#2A0006;
  --f-black:'Jacquard 24','Jacquard Fallback',Georgia,serif;
  --f-ui:'EB Garamond',Garamond,Georgia,serif;
  --f-text:'EB Garamond',Garamond,Georgia,serif;
  --f-head:'IM Fell English',Georgia,serif;
  --bar-h:64px; --vh:100vh;
  --ease-out:cubic-bezier(.165,.84,.44,1); --ease-in-out:cubic-bezier(.645,.045,.355,1);
}
@supports (height:100dvh){ :root{--vh:100dvh} }
html,body{height:100%}
.no-js #landing,.no-js #app,.no-js #classic,.no-js #boot{display:none!important}
body{
  margin:0; overflow:hidden; color:var(--bone); font-family:var(--f-text); font-size:18px; line-height:1.5;
  background:var(--muscle-3);
}
body.is-classic{overflow:auto; background:var(--ink)}
a{color:inherit}
button{font:inherit; color:inherit; cursor:pointer}
/* Focus: anello doppio (inchiostro + grasso) così si vede sia sull'avorio sia sulla carne. */
:focus-visible{outline:3px solid var(--ink); outline-offset:0; box-shadow:0 0 0 6px var(--fat)}
.win-body:focus-visible{outline:none; box-shadow:inset 0 0 0 3px var(--fat)}
.ld-card:focus-visible{box-shadow:10px 12px 0 #000, 0 0 0 6px var(--fat)}
.win:focus-visible{outline:none; box-shadow:12px 14px 0 #000, 0 0 0 6px var(--fat)}
.skip-link{position:absolute; left:16px; top:-60px; z-index:5000; padding:10px 14px; background:var(--fat); color:var(--ink); border:3px solid var(--ink); border-radius:10px; font:600 16px var(--f-ui); text-decoration:none}
.skip-link:focus{top:16px}

/* ---------- sfondo: fibre muscolari, vene, vignettatura ---------- */
#app{position:fixed; inset:0; height:var(--vh)}
.bg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.vignette{position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse 70% 65% at 50% 45%, transparent 55%, rgba(12,2,5,.55) 100%)}
#splats{position:absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden}
.splat{position:absolute; width:90px; height:90px; margin:-45px 0 0 -45px; fill:var(--blood); animation:splatIn .18s var(--ease-out), splatFade 9s 2.5s forwards}
@keyframes splatIn{from{transform:var(--t) scale(.2)}to{transform:var(--t)}}
@keyframes splatFade{to{opacity:0}}
/* Solo due loop ambientali: la colata in alto e il battito delle vene. Entrambi in pausa quando la scheda è nascosta. */
.ooze{transform-origin:top; animation:ooze 4s ease-in-out infinite}
@keyframes ooze{0%,100%{transform:scaleY(.9)}50%{transform:scaleY(1.08)}}
.veins{animation:veinPulse 1.6s ease-in-out infinite}
@keyframes veinPulse{0%,100%{opacity:.7}12%{opacity:1}24%{opacity:.7}}
.paused *{animation-play-state:paused !important}

/* livelli di gore */
.gore-off .blood, .gore-off .win-drip, .gore-off #splats{display:none}
.gore-low .ooze, .gore-low #splats, .gore-low .win-drip, .gore-low #boot .blood{display:none}
/* movimento off */
.motion-off *, .motion-off *::before, .motion-off *::after{animation:none !important; transition:none !important}

/* icone */
#icons{position:absolute; z-index:2; left:20px; top:24px; display:grid; grid-template-columns:repeat(2,112px); gap:18px 8px}
.icon{display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px 2px; background:none; border:0; border-radius:10px; font:400 14px/1.3 var(--f-ui); color:var(--bone); text-align:center}
.icon .lbl{background:var(--ink); padding:2px 5px; border-radius:4px}
@media (hover:hover) and (pointer:fine){
  .icon:hover .glyph{animation:twitch .5s steps(2) 2}
  .icon:hover .lbl{background:var(--blood-dry)}
}
.icon:focus-visible .glyph{animation:twitch .5s steps(2) 2}
@keyframes twitch{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg) scale(1.05)}60%{transform:rotate(6deg)}}
.tip{margin:18px 0 0; padding:10px 12px; max-width:62ch; border:2px dashed var(--ink-soft); border-radius:10px 14px 8px 16px; font:400 15px/1.5 var(--f-ui); color:var(--ink-soft)}

/* ---------- finestre ---------- */
#windows{position:absolute; inset:0 0 var(--bar-h) 0; z-index:10; pointer-events:none}
.win{
  position:absolute; pointer-events:auto; display:flex; flex-direction:column;
  width:min(720px,calc(100vw - 300px)); height:min(620px,calc(var(--vh) - var(--bar-h) - 60px));
  background:var(--bone); color:var(--ink); border:4px solid var(--ink);
  border-radius:26px 34px 22px 38px / 30px 22px 36px 26px; box-shadow:10px 12px 0 #000;
}
.win.wide{width:min(900px,calc(100vw - 300px))}
.win.small{width:min(520px,calc(100vw - 300px)); height:auto; max-height:calc(var(--vh) - var(--bar-h) - 60px)}
.win:focus{outline:none}
.win.is-top{box-shadow:12px 14px 0 #000, 0 0 0 3px var(--fat)}
.win-bar{display:flex; align-items:center; gap:10px; padding:8px 12px 8px 14px; background:var(--flesh-deep); color:var(--bone); border-bottom:4px solid var(--ink); border-radius:22px 30px 0 0; cursor:grab; user-select:none; touch-action:none}
.win-bar:active{cursor:grabbing}
.win-bar h2{flex:1; margin:0; font:600 16px var(--f-ui); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.win-btns{display:flex; gap:8px}
.win-btns button{width:32px; height:32px; border:3px solid var(--ink); border-radius:50%; padding:0; display:grid; place-items:center; transition:transform .12s ease}
.win-btns button:active{transform:scale(.92)}
.win-btns .min{background:var(--fat)}
.win-btns .close{background:var(--blood); color:var(--bone)}
.teeth{display:block; width:100%; height:16px; flex:0 0 auto}
.win-body{flex:1; min-height:0; overflow:auto; padding:6px 30px 26px; font-size:17px; line-height:1.6; overscroll-behavior:contain}
.win-stitch{flex:0 0 18px; border-top:3px dashed var(--blood-dry); background:repeating-linear-gradient(135deg,transparent 0 9px,var(--ink) 9px 12px,transparent 12px 22px); border-radius:0 0 18px 34px}
.win-drip{position:absolute; left:0; right:0; bottom:-74px; width:100%; height:76px; pointer-events:none}

/* incisione all'apertura / sutura alla chiusura */
.win.opening{animation:incise .42s var(--ease-out)}
@keyframes incise{0%{clip-path:inset(49.6% 48% 49.6% 48%)}30%{clip-path:inset(49.2% 0 49.2% 0)}42%{clip-path:inset(47.5% 0 47.5% 0)}100%{clip-path:inset(-20px -20px -90px -20px)}}
.win .cut{position:absolute; left:4%; right:4%; top:50%; height:5px; margin-top:-2px; background:var(--blood); border-radius:3px; transform:scaleX(0); opacity:0; pointer-events:none}
.win.opening .cut{animation:cut .42s var(--ease-out)}
@keyframes cut{0%{transform:scaleX(0); opacity:1}30%{transform:scaleX(1); opacity:1}100%{transform:scaleX(1); opacity:0}}
/* chiusura: prima compaiono le suture (220 ms), poi la pelle si richiude (300 ms) */
.win.closing{animation:sew .3s .22s var(--ease-in-out) forwards}
@keyframes sew{0%{clip-path:inset(-20px -20px -90px -20px)}100%{clip-path:inset(50% 0 50% 0)}}
.win .sutures{position:absolute; left:3%; right:3%; top:50%; height:22px; margin-top:-11px; opacity:0; pointer-events:none; background:repeating-linear-gradient(90deg,transparent 0 6px,var(--ink) 6px 9px,transparent 9px 26px)}
.win.closing .sutures{animation:sutures .2s var(--ease-out) forwards}
@keyframes sutures{0%{opacity:0; transform:scaleX(.6)}100%{opacity:1; transform:scaleX(1)}}

/* ---------- contenuto delle finestre ---------- */
.win-body h1,.cl h1{font:400 clamp(56px,7vw,92px)/.92 var(--f-black); color:var(--blood-dry); margin:10px 0 6px; text-wrap:balance}
.win-body h2.t,.cl h2.t{font:400 clamp(32px,3.9vw,44px)/1.1 var(--f-head); color:var(--blood-dry); margin:14px 0 6px; text-wrap:balance}
.win-body h3,.cl h3{font:400 24px/1.2 var(--f-head); color:var(--blood-dry); margin:26px 0 6px}
.meta{font:700 20px/1.45 var(--f-text); color:var(--ink-soft); margin:0 0 14px}
.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px 18px; margin:8px 0 14px; padding:12px 14px; border:3px solid var(--ink); border-radius:12px 18px 10px 20px; background:var(--bone-2)}
.facts div{display:flex; flex-direction:column; gap:1px; min-width:0}
.facts dt{font:400 14px/1.3 var(--f-ui); color:var(--ink-soft)}
.facts dd{margin:0; font:700 17px/1.3 var(--f-text); color:var(--ink); overflow-wrap:anywhere}
.strip{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; margin:6px 0 14px; border:3px solid var(--ink); border-radius:14px 20px 12px 22px; overflow:hidden; background:var(--bone)}
.strip > div{padding:12px 14px; border-left:3px solid var(--ink); min-width:0}
.strip > div:first-child{border-left:0}
.strip b{display:block; font:700 20px/1.2 var(--f-text); color:var(--blood-dry); margin-bottom:6px}
.strip p{margin:0; font-size:15px; line-height:1.45}
.strip .r{background:var(--bone-2)}
.lede{font-size:21px; line-height:1.45; margin:6px 0 10px; max-width:58ch}
.prose{max-width:62ch}
.prose p{margin:0 0 12px}
.prose ul{margin:0 0 12px; padding-left:1.2em}
.prose li{margin:0 0 8px}
.problem{margin:6px 0; padding:14px 18px; border:3px solid var(--ink); border-radius:16px 22px 12px 24px; background:var(--bone-2); font-size:20px; line-height:1.4; font-style:italic; max-width:58ch}
.loop{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:6px 0 12px; font:600 17px var(--f-ui)}
.loop span{padding:8px 12px; border:3px solid var(--ink); border-radius:12px 16px 10px 18px; background:var(--bone)}
.loop span.end{background:var(--blood); color:var(--bone)}
.loop i{font-style:normal; color:var(--blood-dry)}
.ghosts{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin:8px 0}
.ghost{padding:12px 14px; border:3px solid var(--ink); border-radius:14px 20px 12px 22px; background:var(--bone-2)}
.ghost b{display:block; font:700 21px/1.2 var(--f-text); color:var(--blood-dry); margin-bottom:4px}
.ghost span{font-size:15px}
.ph{display:grid; place-items:center; text-align:center; padding:12px; border:3px dashed var(--blood-dry); border-radius:12px; background:repeating-linear-gradient(135deg,var(--bone-2) 0 10px,var(--bone) 10px 20px); font:400 14px/1.4 var(--f-ui); color:var(--ink-soft); max-width:100%; box-sizing:border-box}
.ph-169{aspect-ratio:16/9; width:min(100%,570px); max-height:320px}
.ph-portrait{width:140px; aspect-ratio:4/5; float:right; margin:0 0 10px 16px}
.gallery{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin:8px 0}
.gallery .ph-169{width:100%; max-height:none}
.todo{display:inline; padding:1px 6px; background:var(--fat); color:var(--ink); border-radius:4px; font:600 15px var(--f-ui)}
.script{margin:8px 0; padding:18px; border:3px solid var(--ink); border-radius:14px; background:#FBF6EE; font:400 17px/1.7 var(--f-ui); text-align:center}
.script .who{font-weight:600; letter-spacing:.1em}
.script .par{color:var(--ink-soft)}
.btn{display:inline-flex; align-items:center; min-height:46px; padding:0 18px; border:3px solid var(--ink); background:var(--bone); color:var(--ink); font:600 16px var(--f-ui); text-decoration:none; border-radius:14px 20px 12px 22px; transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn.red{background:var(--blood); color:var(--bone)}
.btn[aria-disabled="true"]{border-style:dashed; color:var(--ink-soft); cursor:not-allowed}
.btns{display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 6px}
.list{list-style:none; padding:0; margin:8px 0; display:grid; gap:8px}
.list li{display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; padding:12px 14px; border:3px solid var(--ink); border-radius:12px; background:var(--bone-2)}
.list li b{font:700 22px/1.25 var(--f-text); color:var(--blood-dry)}
.list li.sealed{border-style:dashed}
.list li:has(.proj){padding:0}
.proj{width:100%; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; padding:12px 40px 12px 14px; position:relative; background:none; border:0; border-radius:10px; text-align:left; color:var(--ink); font:400 17px/1.4 var(--f-text)}
.proj > span{min-width:0}
@media (hover:hover){ .proj:hover{background:var(--bone)} }
.proj b{flex:1 1 100%}
.proj .arr{position:absolute; right:14px; top:50%; transform:translateY(-50%); font:600 25px var(--f-ui); color:var(--blood-dry)}
.email{font:600 clamp(16px,2.4vw,22px) var(--f-ui); color:var(--ink); text-decoration:underline; text-underline-offset:4px; word-break:break-all; padding:10px 12px; border:3px solid var(--ink); border-radius:12px; background:#FBF6EE; display:inline-block}
.tools{font:400 16px/1.8 var(--f-ui)}

/* ---------- barra ---------- */
.gums{position:absolute; left:0; right:0; bottom:var(--bar-h); height:26px; z-index:900; pointer-events:none}
#taskbar{position:absolute; left:0; right:0; bottom:0; z-index:1000; height:var(--bar-h); box-sizing:border-box; padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px)); display:flex; align-items:center; gap:10px; background:var(--ink); border-top:4px solid var(--flesh-raw); font:400 15px var(--f-ui)}
#startBtn{display:flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; background:var(--flesh-deep); color:var(--bone); border:3px solid var(--bone); border-radius:22px; font:600 16px var(--f-ui); flex:0 0 auto}
#tabs{flex:1; min-width:0; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none}
#tabs button{flex:0 0 auto; min-height:40px; padding:0 12px; background:var(--membrane); color:var(--bone); border:2px solid transparent; border-radius:10px; font:400 14px var(--f-ui)}
#tabs button.active{border-color:var(--fat)}
#tabs button.min{opacity:.7; font-style:italic}
.settings{display:flex; gap:6px; flex:0 0 auto}
.settings button{min-height:40px; padding:0 10px; background:transparent; color:var(--bone); border:2px solid var(--flesh); border-radius:10px; font:400 14px var(--f-ui)}
.settings button.gore{background:var(--blood); border-color:var(--blood)}
.settings button.classic{background:var(--fat); color:var(--ink); border-color:var(--fat); font-weight:600}

#startmenu{position:absolute; z-index:1100; left:12px; bottom:calc(var(--bar-h) + 10px); width:min(320px,calc(100vw - 24px)); max-height:calc(var(--vh) - var(--bar-h) - 30px); overflow:auto; background:var(--bone); color:var(--ink); border:4px solid var(--ink); border-radius:18px 26px 14px 28px; box-shadow:8px 10px 0 #000}
#startmenu .sm-head{padding:12px 16px; background:var(--flesh-deep); color:var(--bone); border-bottom:4px solid var(--ink); font:400 34px/1 var(--f-black)}
#startmenu ul{list-style:none; margin:0; padding:8px}
#startmenu li button{width:100%; display:flex; justify-content:space-between; align-items:center; min-height:42px; padding:0 10px; background:none; border:0; border-radius:8px; font:400 15px var(--f-ui); text-align:left; color:var(--ink)}
#startmenu li button:hover,#startmenu li button:focus-visible{background:var(--bone-2)}
#startmenu .sep{height:3px; margin:6px 8px; background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 12px)}

#toast{position:absolute; z-index:1500; left:50%; bottom:calc(var(--bar-h) + 40px); transform:translateX(-50%); padding:10px 16px; background:var(--fat); color:var(--ink); border:3px solid var(--ink); border-radius:12px; font:600 15px var(--f-ui)}

/* ---------- avvio: la bocca (variante A, fauci piene) ---------- */
#boot{position:fixed; inset:0; z-index:2000; height:var(--vh); overflow:hidden}
#boot .hw{position:absolute; left:0; right:0; height:calc(50% - 60px)}
#boot .top{top:0} #boot .bot{bottom:0}
#boot .half{position:absolute; inset:0; background:#0B0406}
#boot .throat{position:absolute; left:0; right:0; top:calc(50% - 60px); height:120px; background:linear-gradient(180deg,var(--muscle-3) 0%, #1E0208 50%, var(--muscle-3) 100%); transition:opacity .3s .35s}
#boot .uvula{position:absolute; left:50%; top:calc(50% - 56px); width:48px; height:40px; margin-left:-22px; background:var(--flesh-deep); border:3px solid var(--ink); border-radius:50% 50% 60% 60%; box-sizing:border-box}
#boot .uvula::after{content:""; position:absolute; left:50%; bottom:-4px; width:14px; height:16px; margin-left:-7px; background:var(--flesh-raw); border-radius:50%}
#boot.torn .throat,#boot.torn .uvula{opacity:0}
#boot .gum{position:absolute; left:0; width:100%; height:34px}
#boot .top .gum{bottom:-2px} #boot .bot .gum{top:-2px}
#boot .fangs{position:absolute; left:0; width:100%; height:90px; overflow:visible}
#boot .top .fangs{top:calc(100% - 4px)}
#boot .bot .fangs{bottom:calc(100% - 4px)}
#boot .saliva{position:absolute; top:calc(50% - 40px); width:3px; height:80px; background:var(--flesh); border-radius:2px; transform-origin:top; opacity:.9}
#boot .saliva.s1{left:31%} #boot .saliva.s2{left:66%; height:64px}
#boot .saliva::after{content:""; position:absolute; left:-2px; bottom:-4px; width:7px; height:7px; border-radius:50%; background:var(--flesh)}
#boot.torn .saliva{animation:saliva .55s ease-in forwards}
@keyframes saliva{0%{transform:scaleY(1); opacity:.9}100%{transform:scaleY(6); opacity:0}}
/* le mascelle si serrano un attimo (overshoot) e poi si spalancano */
#boot.torn .top{animation:jawTop .8s cubic-bezier(.7,0,.3,1) forwards}
#boot.torn .bot{animation:jawBot .8s cubic-bezier(.7,0,.3,1) forwards}
@keyframes jawTop{0%{transform:none}14%{transform:translateY(1.6%)}100%{transform:translateY(-104%)}}
@keyframes jawBot{0%{transform:none}14%{transform:translateY(-1.6%)}100%{transform:translateY(104%)}}
/* il cartellino pinzato sulla gengiva superiore: sale via con la mascella */
#boot .txt{position:absolute; left:50%; bottom:34px; transform:translateX(-50%); width:min(640px,calc(100vw - 32px)); max-height:calc(100% - 44px); overflow:auto; box-sizing:border-box; padding:24px 26px; background:#0B0406; border:3px solid var(--flesh-raw); border-radius:6px 10px 4px 12px; box-shadow:8px 10px 0 #000; font:400 16px/1.9 var(--f-ui); color:#E8D3C8; z-index:3}

   '<div class="prose">' + (it ?
   '<p>Sono un Junior Game &amp; Narrative Designer in formazione alla Digital Bros Game Academy di Milano (fino all’estate 2027), dove progetto sistemi di gioco, livelli e storie per esperienze interattive.</p><p>Vengo dalla scrittura: ho completato il primo anno di Strategic Writing &amp; Screenwriting all’AIV (Accademia Italiana Videogiochi), con basi di struttura narrativa, personaggi e analisi tra giochi, cinema e TV. Alla DBGA l’ho ampliata al game design completo: meccaniche, level design, bilanciamento e produzione.</p><h3>Cosa porto</h3><ul><li>Unisco design e scrittura: costruisco sistemi di gioco senza perdere il filo della storia.</li><li>Attento allo scope: abituato a consegnare in tempo, in team e da solo.</li><li>Multidisciplinare: capisco cosa serve a programmatori, artisti e producer e progetto di conseguenza.</li></ul><h3>Obiettivo</h3><p>Dopo l’accademia (estate 2027) cerco un ruolo da Junior Game / Narrative Designer, in studi italiani indie e mid-size o da remoto, meglio se su giochi narrativi o con un’identità forte.</p>'
   :

/* ---------- audio ---------- */
var actx = null;
function sfx(kind){
 if (!S.sound) return;
 try {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  var now = actx.currentTime;
  var len = kind==="open" ? .35 : kind==="chomp" ? .5 : .12;
  var buf = actx.createBuffer(1, Math.floor(actx.sampleRate*len), actx.sampleRate);
  var d = buf.getChannelData(0);
  for (var i=0;i<d.length;i++){ var env = 1 - i/d.length; d[i] = (Math.random()*2-1) * env * env; if (kind==="chomp" && i > d.length*0.45 && i < d.length*0.55) d[i]=0; }
  var src = actx.createBufferSource(); src.buffer = buf;
  var f = actx.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(kind==="open"?1800:kind==="close"?500:900, now);
  f.frequency.exponentialRampToValueAtTime(kind==="open"?180:120, now+len);
  f.Q.value = kind==="open"?9:4;
  var g = actx.createGain(); g.gain.value = kind==="click"?.25:.5;
  src.connect(f); f.connect(g); g.connect(actx.destination); src.start(now);
 } catch(e){}
}

/* ---------- toast ---------- */
var toastTimer = null;
function say(msg){ toast.textContent = msg; toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toast.hidden = true; }, 2200); }

/* ---------- finestre ---------- */
var open = {}; var zTop = 20; var cascade = 0; var lastOpener = {};
function isSmall(){ return window.innerWidth <= 760; }
function setHash(id){ try { history.replaceState(null, "", id ? "#" + id : location.pathname + location.search); } catch(e){} }

function buildWin(id){
 var def = W[id];
 var el = document.createElement("section");
 el.className = "win" + (def.size ? " " + def.size : "");
 el.setAttribute("role","dialog");
 el.setAttribute("aria-labelledby","wt-"+id);
 el.tabIndex = -1;
 el.dataset.id = id;
 el.innerHTML =
  '<div class="win-bar">' + EYE + '<h2 id="wt-' + id + '">' + fname(id) + '</h2><div class="win-btns"><button class="min" aria-label="' + t("min") + '">' + MIN_BAR + '</button><button class="close" aria-label="' + t("close") + '">' + CLOSE_X + '</button></div></div>' +
  TEETH + '<div class="win-body" tabindex="0"></div><div class="win-stitch" aria-hidden="true"></div>' + DRIP +
  '<div class="cut" aria-hidden="true"></div><div class="sutures" aria-hidden="true"></div>';
 el.querySelector(".win-body").innerHTML = def.body();
 return el;
}
function place(el, id){
 if (isSmall()) return;
 var w = el.offsetWidth, h = el.offsetHeight;
 var areaW = window.innerWidth, areaH = window.innerHeight - parseInt(getComputedStyle(document.documentElement).getPropertyValue("--bar-h")||64,10);
 var x, y;
 if (id === "welcome") { x = Math.max(260, (areaW - w)/2 + 60); y = Math.max(24, (areaH - h)/2 - 20); }
 else { x = Math.min(areaW - w - 20, 270 + (cascade % 6) * 36); y = Math.min(Math.max(20, areaH - h - 30), 30 + (cascade % 6) * 30); cascade++; }
 el.style.left = Math.max(8, x) + "px"; el.style.top = Math.max(8, y) + "px";
}
function focusBody(id){ var el = open[id]; if (!el) return; var b = el.querySelector(".win-body"); (b || el).focus({preventScroll:true}); }
function focusWin(id){
 var el = open[id]; if (!el) return;
 el.hidden = false; el.dataset.min = "";
 zTop++; el.style.zIndex = zTop;
 Object.keys(open).forEach(function(k){ open[k].classList.toggle("is-top", k===id); });
 renderTabs();
 setHash("os");
}
function openWin(id, opener){
 if (!W[id]) return;
 closeStart();
 if (opener) lastOpener[id] = opener;
 if (open[id]) { focusWin(id); focusBody(id); return; }
 var el = buildWin(id);
 winLayer.appendChild(el);
 open[id] = el;
 place(el, id);
 focusWin(id);
 if (S.motion) { el.classList.add("opening"); setTimeout(function(){ el.classList.remove("opening"); }, 440); }
 sfx("open");
 if (S.gore==="max") splatAt(el.getBoundingClientRect().left + el.offsetWidth/2, el.getBoundingClientRect().top + el.offsetHeight/2, 1.6);
 focusBody(id);
}
function closeWin(id){
 var el = open[id]; if (!el) return;
 delete open[id];
 sfx(id==="contact"?"chomp":"close");
 var done = function(){ el.remove(); renderTabs(); var back = lastOpener[id]; if (back && document.body.contains(back)) back.focus(); else { var top = topWinId(); if (top) focusBody(top); } };
 if (S.motion) { el.classList.add("closing"); setTimeout(done, 540); } else done();
 renderTabs();
 setHash("os");
}
function minWin(id){ var el = open[id]; if (!el) return; el.hidden = true; el.dataset.min = "1"; el.classList.remove("is-top"); renderTabs(); }
function topWinId(){ var best = null, bz = -1; Object.keys(open).forEach(function(k){ var el = open[k]; if (el.hidden) return; var z = +el.style.zIndex||0; if (z > bz) { bz = z; best = k; } }); return best; }

function renderTabs(){
 var top = topWinId();
 tabs.innerHTML = "";
 var first = true;
 Object.keys(open).forEach(function(k){
  var b = document.createElement("button");
  b.textContent = fname(k);
  b.tabIndex = (k===top || (!top && first)) ? 0 : -1; first = false;
  if (k===top) { b.classList.add("active"); b.setAttribute("aria-current","true"); }
  if (open[k].hidden) b.classList.add("min");
  b.addEventListener("click", function(){ if (open[k].hidden || k!==topWinId()) { focusWin(k); focusBody(k); } else { minWin(k); } });
  tabs.appendChild(b);
 });
}
/* barra delle finestre: frecce per spostarsi tra le schede (role=toolbar) */
tabs.addEventListener("keydown", function(e){
 if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
 var bs = Array.prototype.slice.call(tabs.querySelectorAll("button")); if (!bs.length) return;
 var i = bs.indexOf(document.activeElement); if (i < 0) i = 0;
 var n = (i + (e.key === "ArrowRight" ? 1 : -1) + bs.length) % bs.length;
 bs.forEach(function(b){ b.tabIndex = -1; }); bs[n].tabIndex = 0; bs[n].focus(); e.preventDefault();
});

/* eventi delle finestre (delegati) */
winLayer.addEventListener("click", function(e){
 var win = e.target.closest(".win"); if (!win) return;
 var id = win.dataset.id;
 if (e.target.closest(".close")) { closeWin(id); return; }
 if (e.target.closest(".min")) { minWin(id); return; }
 var o = e.target.closest("[data-open]"); if (o) { openWin(o.dataset.open, o); return; }
 if (e.target.closest("[data-copy]")) { copyEmail(); return; }
});
winLayer.addEventListener("pointerdown", function(e){
 var win = e.target.closest(".win"); if (!win) return;
 if (win.dataset.id !== topWinId()) focusWin(win.dataset.id);
 var bar = e.target.closest(".win-bar");
 if (!bar || e.target.closest("button") || isSmall()) return;
 e.preventDefault();
 var sx = e.clientX, sy = e.clientY, ox = win.offsetLeft, oy = win.offsetTop;
 bar.setPointerCapture(e.pointerId);
 function mv(ev){
  var nx = ox + ev.clientX - sx, ny = oy + ev.clientY - sy;
  nx = Math.min(Math.max(nx, -win.offsetWidth + 120), window.innerWidth - 120);
  ny = Math.min(Math.max(ny, 0), window.innerHeight - 120);
  win.style.left = nx + "px"; win.style.top = ny + "px";
 }
 function up(){ bar.removeEventListener("pointermove", mv); bar.removeEventListener("pointerup", up); bar.removeEventListener("pointercancel", up); }
 bar.addEventListener("pointermove", mv); bar.addEventListener("pointerup", up); bar.addEventListener("pointercancel", up);
});

function copyEmail(){
 var done = function(){ say(t("copied")); };
 var fail = function(){ var n = document.getElementById("emailText"); if (n) { var r = document.createRange(); r.selectNodeContents(n); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } say(t("copyFail")); };
 try { navigator.clipboard.writeText(EMAIL).then(done, fail); } catch(e){ fail(); }
}

/* ---------- schizzi ---------- */
var splatLayer = document.getElementById("splats");
function splatAt(x, y, scale){
 if (S.gore !== "max") return;
 var s = (scale||1) * (0.6 + Math.random()*0.8);
 var r = Math.floor(Math.random()*360);
 var svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
 svg.setAttribute("viewBox","-20 -10 200 200"); svg.setAttribute("class","splat"); svg.setAttribute("aria-hidden","true");
 svg.style.left = x + "px"; svg.style.top = y + "px";
 var tf = "rotate(" + r + "deg) scale(" + s.toFixed(2) + ")";
 svg.style.setProperty("--t", tf);
 svg.style.transform = tf;
 svg.innerHTML = '<use href="#splatShape" fill="' + (Math.random()<.3?"#6E0410":"#B0081A") + '"/>';
 splatLayer.appendChild(svg);
 while (splatLayer.children.length > 16) splatLayer.firstChild.remove();
 setTimeout(function(){ svg.remove(); }, 12000);
}
app.addEventListener("pointerdown", function(e){
 if (e.target.closest(".win") || e.target.closest("#taskbar") || e.target.closest("#startmenu")) return;
 splatAt(e.clientX, e.clientY, 1);
 if (!e.target.closest(".icon")) sfx("click");
});

 ["welcome","projects"].concat(ICON_ORDER).forEach(function(id){ h += '<li><button data-open="' + id + '"><span>' + fname(id) + '</span><span aria-hidden="true">›</span></button></li>'; });

 else closeStart();

startList.addEventListener("click", function(e){

});
startMenu.addEventListener("keydown", function(e){
 if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
 var bs = Array.prototype.slice.call(startList.querySelectorAll("button"));
 var i = bs.indexOf(document.activeElement); var n = (i + (e.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length;
 bs[n].focus(); e.preventDefault();
});
document.addEventListener("pointerdown", function(e){ if (!startMenu.hidden && !e.target.closest("#startmenu") && !e.target.closest("#startBtn")) closeStart(); });

/* ---------- impostazioni ---------- */
var sGore = document.getElementById("sGore"), sMotion = document.getElementById("sMotion"), sSound = document.getElementById("sSound"), sLang = document.getElementById("sLang"), sClassic = document.getElementById("sClassic");
function toggle(k){
 if (k==="gore") S.gore = S.gore==="max" ? "off" : S.gore==="off" ? "low" : "max";
 if (k==="motion") S.motion = !S.motion;
 if (k==="sound") { S.sound = !S.sound; if (S.sound) setTimeout(function(){ sfx("open"); }, 30); }
 if (k==="lang") { S.lang = S.lang==="en" ? "it" : "en"; relang(); }
 if (k==="classic") { setClassic(true); return; }
 if (k==="reboot") { closeStart(); save(); runBoot(); return; }
 if (k==="home") { showLanding(); return; }
 apply(); save();
}
sGore.addEventListener("click", function(){ toggle("gore"); });
sMotion.addEventListener("click", function(){ toggle("motion"); });
sSound.addEventListener("click", function(){ toggle("sound"); });
sLang.addEventListener("click", function(){ toggle("lang"); });
sClassic.addEventListener("click", function(){ toggle("classic"); });

function apply(){
 document.body.classList.remove("gore-off","gore-low","gore-max"); document.body.classList.add("gore-" + S.gore);
 app.classList.toggle("motion-off", !S.motion); app.classList.toggle("motion-on", S.motion);
 document.body.classList.toggle("motion-off", !S.motion);
 sGore.textContent = T[S.lang].gore[S.gore]; sGore.setAttribute("aria-label", T[S.lang].gore[S.gore]);
 sMotion.textContent = t("motion")[S.motion?1:0]; sMotion.setAttribute("aria-pressed", String(S.motion));
 sSound.textContent = t("sound")[S.sound?1:0]; sSound.setAttribute("aria-pressed", String(S.sound));
 sLang.textContent = t("lang");
 sClassic.textContent = t("classic");
 document.documentElement.lang = S.lang;
 iconsNav.setAttribute("aria-label", t("desktop"));
 tabs.setAttribute("aria-label", t("openWins"));
 document.querySelector(".settings").setAttribute("aria-label", t("settings"));
 var le = document.getElementById("ldEn"), li = document.getElementById("ldIt");
 if (le) { le.setAttribute("aria-pressed", String(S.lang==="en")); li.setAttribute("aria-pressed", String(S.lang==="it")); }
 document.querySelectorAll("[data-i18n]").forEach(function(n){ n.textContent = t(n.dataset.i18n); });
 skipBtn.textContent = S.motion ? t("skip") : t("cont");
}
function relang(){
 Object.keys(open).forEach(function(k){
  var b = open[k].querySelector(".win-body"); var top = b.scrollTop; b.innerHTML = W[k].body(); b.scrollTop = top;
  open[k].querySelector(".min").setAttribute("aria-label", t("min")); open[k].querySelector(".close").setAttribute("aria-label", t("close"));
  open[k].querySelector(".win-bar h2").textContent = fname(k);
 });
 renderIcons(); renderTabs();
 if (S.classic) { var y = window.scrollY; renderClassic(); window.scrollTo(0, y); }
}

/* ---------- vista classica ---------- */

 var it = S.lang==="it";
 var nav = [["about", it?"Chi sono":"About me"],["projects", it?"Progetti":"Projects"],["personal", it?"Personali":"Personal"],["writing", it?"Narrativa":"Narrative"],["contact", it?"Contatti":"Contact"]];
 var h = '<a class="skip-link" href="#c-projects">' + t("skipTo") + '</a>';
 h += '<div class="cl-top"><b>Matteo Marrale</b><button class="cl-menu" id="clMenu" aria-expanded="false" aria-controls="clPanel">' + t("menu") + '</button><div class="cl-panel" id="clPanel"><nav aria-label="' + t("sections") + '">' + nav.map(function(n){ return '<a href="#c-' + n[0] + '">' + n[1] + '</a>'; }).join("") + '</nav><div class="act"><button id="clHome">Home</button><button id="clLang">' + t("lang") + '</button><button id="clBack">' + t("toOs") + '</button></div></div></div>';
 h += '<div class="cl">';

 ["antiques","casino","cosmic","train","nigishida"].forEach(function(id){ h += '<article id="' + id + '">' + W[id].body() + '</article>'; });
 h += '</div>';
 h += '<section id="c-personal">' + W.personal.body() + '</section>';
 h += '<div id="c-personal-sheets" style="display:grid;gap:28px">';
 ["splitter","catnhell","otherside"].forEach(function(id){ h += '<article id="' + id + '">' + W[id].body() + '</article>'; });
 h += '</div>';
 h += '<section id="c-writing">' + W.eleanor.body() + '</section>';
 h += '<section id="c-contact">' + W.contact.body() + '</section>';
 h += '</div>';
 classic.innerHTML = h;
 /* ogni pulsante della pagina scorre alla scheda giusta (SPLITTER, Cat 'n' Hell!, Other Side inclusi) */
 classic.querySelectorAll("[data-open]").forEach(function(b){ b.addEventListener("click", function(){ var tid = webTarget(b.dataset.open); if (tid) goWeb(tid, false); }); });
 var menuBtn = document.getElementById("clMenu"), bar = classic.querySelector(".cl-top");
 menuBtn.addEventListener("click", function(){ setMenu(!bar.classList.contains("open")); });
 classic.querySelectorAll(".cl-top nav a").forEach(function(a){ a.addEventListener("click", function(){ setMenu(false); }); });
 measureTop();
 classic.querySelectorAll("[data-copy]").forEach(function(b){ b.addEventListener("click", copyEmail); });
 document.getElementById("clLang").addEventListener("click", function(){ S.lang = S.lang==="en"?"it":"en"; apply(); relang(); save(); var b2 = document.getElementById("clLang"); if (b2) b2.focus({preventScroll:true}); });
 document.getElementById("clBack").addEventListener("click", function(){ setClassic(false); });
 document.getElementById("clHome").addEventListener("click", showLanding);
}
function setMenu(open){ var bar = classic.querySelector(".cl-top"), b = document.getElementById("clMenu"); if (!bar || !b) return; bar.classList.toggle("open", open); b.setAttribute("aria-expanded", String(open)); }
/* altezza reale della barra: serve a scroll-margin-top delle ancore */
function measureTop(){ var bar = classic.querySelector(".cl-top"); if (bar) document.documentElement.style.setProperty("--cl-top-h", bar.offsetHeight + "px"); }
function goWeb(tid, instant){
 var n = document.getElementById(tid); if (!n) return;
 measureTop();
 n.scrollIntoView({behavior: (S.motion && !instant) ? "smooth" : "auto", block:"start"});
 var hd = n.matches("h1,h2") ? n : n.querySelector("h1, h2"); if (hd) { hd.tabIndex = -1; hd.focus({preventScroll:true}); }
 if (CARDS.indexOf(tid) >= 0) setHash(tid);
}
function stopBoot(){ if (boot.hidden) return; bootTimers.forEach(clearTimeout); bootTimers = []; bootDone = true; boot.hidden = true; }
function setClassic(on, keepPlace){
 S.classic = on;
 closeStart();
 if (on) stopBoot();
 app.hidden = on; classic.hidden = !on;
 document.body.classList.toggle("is-classic", on);
 /* entrando nella versione web il focus va sull'h1 (il nome), non sul pulsante "Carne Viva OS" */
 if (on) { renderClassic(); if (!keepPlace) { window.scrollTo(0,0); setHash("web"); var f = classic.querySelector("#c-top h1"); if (f) f.focus({preventScroll:true}); } }
 else { classic.innerHTML = ""; if (!osBooted) runBoot(); else { setHash("os"); sClassic.focus(); } }
}

/* ---------- tastiera ---------- */

document.addEventListener("keydown", function(e){
 if (!landing.hidden) return;
 if (!boot.hidden) { if (MOD_KEYS[e.key]) return; if (!boot.classList.contains("torn")) { finishBoot(); e.preventDefault(); } return; }

/* ---------- avvio ---------- */
var bootLines = document.getElementById("bootLines");
var bootDone = false, bootTimers = [];
function renderBootLines(){
 bootLines.innerHTML = T[S.lang].boot.map(function(l){ return '<p class="ln"><span>' + l[0] + '</span><span class="' + l[2] + '">' + l[1] + '</span></p>'; }).join("");
}
function finishBoot(){
 if (bootDone) return; bootDone = true;
 bootTimers.forEach(clearTimeout); bootTimers = [];
 bootLines.querySelectorAll(".ln").forEach(function(n){ n.classList.add("on"); });
 var reveal = function(){ boot.hidden = true; startDesktop(); };
 if (!S.motion) { reveal(); return; }
 boot.classList.add("torn"); sfx("open");
 bootTimers.push(setTimeout(reveal, 820));
}
function runBoot(){
 bootDone = false;
 boot.className = "";
 boot.hidden = false;
 renderBootLines();
 setHash("os");
 skipBtn.textContent = S.motion ? t("skip") : t("cont");
 skipBtn.focus({preventScroll:true});
 var lines = bootLines.querySelectorAll(".ln");
 if (!S.motion) { /* senza movimento: tutte le righe subito, si aspetta un tasto o un clic */ lines.forEach(function(n){ n.classList.add("on"); }); return; }
 /* ritmo scelto da Matteo: una riga al secondo, poi 3 s per leggere prima dello strappo (saltabile) */
 lines.forEach(function(n, i){ bootTimers.push(setTimeout(function(){ n.classList.add("on"); }, 1000 + i*1000)); });
 bootTimers.push(setTimeout(finishBoot, lines.length*1000 + 3000));
}
var initialHash = (location.hash || "").replace("#",""); /* letto prima che l'avvio riscriva l'hash */
function startDesktop(){
 var first = !osBooted;
 osBooted = true;
 openWin("welcome");
 if (first && initialHash && W[initialHash] && initialHash !== "welcome") openWin(initialHash);
}
boot.addEventListener("click", function(){ finishBoot(); });

/* instradamento: #os = Carne Viva OS; #web = versione web; #antiques, #splitter, … = versione web sulla scheda; niente hash = home */
function route(initial){
 var hash = (location.hash || "").replace("#","");
 if (hash === "os") {
  if (S.classic) setClassic(false);
  else if (!landing.hidden || app.hidden) enterOS();
  return;
 }
 if (hash === "classic" || hash === "web") { if (!S.classic) enterWeb(); return; }
 var tid = webTarget(hash);
 if (tid) {
  if (!S.classic) { landing.hidden = true; setClassic(true, true); }
  if (!document.getElementById(tid)) { if (initial) { window.scrollTo(0,0); setHash("web"); } return; }
  requestAnimationFrame(function(){ goWeb(tid, initial); });
  /* i font cambiano le altezze: al primo caricamento si riallinea quando sono pronti */
  if (initial && document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if ((location.hash || "").replace("#","") === tid) goWeb(tid, true); });
  return;
 }
 if (!hash) { if (initial || S.classic || !app.hidden) showLanding(); return; }
 if (initial) showLanding();
}
route(true);
window.addEventListener("hashchange", function(){ route(false); });
window.addEventListener("resize", function(){ if (S.classic) { measureTop(); if (!isSmall()) setMenu(false); } });
window.addEventListener("resize", function(){ if (isSmall()) return; Object.keys(open).forEach(function(k){ var el = open[k]; var maxX = window.innerWidth - 120, maxY = window.innerHeight - 160; if (el.offsetLeft > maxX) el.style.left = maxX + "px"; if (el.offsetTop > maxY) el.style.top = Math.max(8,maxY) + "px"; }); });
})();
</script>

</body></html>
